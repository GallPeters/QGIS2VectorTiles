<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapLibre Viewer</title>
    <link rel="stylesheet" href="maplibre-gl.css">
    <link rel="stylesheet" href="bundle.css">
    <style>
        :root { --q2vt-right-top: 108px; }
        .maplibregl-popup-content { padding: 8px; border-radius: 6px; }
    </style>
    <script>
        // Filled in by the plugin when it serves the map.
        window.Q2VT_CONFIG = {
            minZoom: _Q2VT_MINZOOM,
            center: _Q2VT_CENTER,
            storageKey: "_Q2VT_STORAGE_KEY",
            styleUrl: "/style/style.json",
            searchUrl: "/style/search.json",
        };
    </script>
</head>
<body>
<div id="map"></div>
<script type="module" src="bundle.js"></script>
</body>
</html>
