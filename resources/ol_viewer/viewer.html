<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLayers Viewer</title>
    <link rel="stylesheet" href="ol.css">
    <link rel="stylesheet" href="bundle.css">
    <style>
        :root { --q2vt-right-top: 74px; }
        #map { background: #ffffff; }
        .ol-zoom { top: 10px; right: 10px; left: auto !important; }
        /* Pointer events go to the viewport, not to the layer canvases
           (which OpenLayers replaces as layers change): the drawing tools
           listen there and need it to be the event target. */
        .ol-layers, .ol-layers * { pointer-events: none; }
        .q2vt-ol-popup {
            position: relative; background: #ffffff; border-radius: 6px; padding: 6px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.18); min-width: 60px;
        }
        .q2vt-ol-popup:empty { display: none; }
        .q2vt-ol-popup::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; margin-left: -8px;
            border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-top: 8px solid #ffffff;
        }
    </style>
    <script>
        // Filled in by the plugin when it serves the map.
        window.Q2VT_CONFIG = {
            minZoom: _Q2VT_MINZOOM,
            center: _Q2VT_CENTER,
            storageKey: "_Q2VT_STORAGE_KEY",
            styleUrl: "/style/style.json",
            searchUrl: "/style/search.json",
        };
    </script>
</head>
<body>
<div id="map"></div>
<script type="module" src="bundle.js"></script>
</body>
</html>
