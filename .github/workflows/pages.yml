# Publishes the website (docs/) to GitHub Pages. Pages does not serve Git
# LFS files when it publishes straight from a branch, so the LFS files (the
# gallery examples' tiles) are downloaded here before the site is uploaded.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

# One deployment at a time: a new push waits for the running one to finish
# (cancelling the run would not stop a deployment it has already started,
# and Pages refuses a second one meanwhile).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # An earlier deployment that never finished blocks every later one
      # ("in progress deployment"). Runs wait for each other (above), so
      # any earlier one still in progress here is stuck: cancel it.
      - name: Cancel stuck earlier deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            if gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" > /dev/null 2>&1; then
              echo "Cancelled the deployment of $sha"
            fi
          done
      - id: deployment
        uses: actions/deploy-pages@v4
