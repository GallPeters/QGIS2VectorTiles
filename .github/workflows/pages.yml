# Publishes the website (docs/) to GitHub Pages. Pages does not serve Git
# LFS files when it publishes straight from a branch, so the LFS files (the
# gallery examples' tiles) are downloaded here before the site is uploaded.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a new push waits for the running one to finish
# (cancelling the run would not stop a deployment it has already started,
# and Pages refuses a second one meanwhile).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
