# The home page's gallery (the "See it in action" section): one card per
# example web map, in this order. assets/gallery.js reads this file.
#
# id           A short name, unique in this file.
# title        The card's title.
# extent       Where the map is: a place name, and its bounds
#              [west, south, east, north] in degrees (shown on hover).
# zooms        The web map's zoom levels [lowest, highest].
# layers       How many layers the QGIS project has.
# size         The QGIS project's data (original) and the exported web map
#              (output), in MB: the card shows the saving (sizes on hover).
# time         Optional: how long the plugin took to make it (e.g. "3.5 min").
# description  One or two short sentences.
# tags         A few words on what the example shows.
# image        A still of the map (docs/gallery/), about 16:10.
# webmap       The full web map: its folder in docs/examples/.
# view         Where the live preview and the full web map open: zoom,
#              centre [lon, lat] (without them, fitted to the map's whole
#              extent), and optionally the background (basemap: none, osm,
#              bluemarble or openfreemap).
# project      The QGIS project to download (address and size in MB).
#              Leave the address empty until there is one.
# coming_soon  true for a placeholder card (a title and a line of text);
#              its buttons are off.

examples:
  - id: natural-earth
    title: Natural Earth
    extent:
      name: World
      bounds: [-180, -85.85, 180, 84.05]
    zooms: [0, 8]
    layers: 235
    size:
      original: 827
      output: 49.8
    time: 3.1 min
    description: >-
      The whole Natural Earth quick-start project, from the world map
      down to regional detail.
    tags: [Rule-based styles, Scale-dependent labels, Global]
    image: gallery/natural-earth.webp
    webmap: examples/natural-earth/
    view: { zoom: 2.4, center: [20, 40] }
    project: { url: "", size: null }

  - id: israel-bus-stops
    title: Israel Bus Stops
    extent:
      name: Israel
      bounds: [34.285, 29.494, 35.839, 33.282]
    zooms: [0, 19]
    layers: 2
    size:
      original: 42
      output: 9.6
    time: 41 sec
    description: >-
      Every bus stop in Israel as a sign listing its lines, in clusters
      when zoomed out, styled in QGIS from GTFS data.
    tags: [Balloon callouts, Geometry generators, Hebrew labels]
    image: gallery/israel-bus-stops.webp
    webmap: examples/israel-bus-stops/
    view: { basemap: osm }
    project: { url: "", size: null }

  - id: coming-soon
    title: Coming soon
    description: Another example web map is on its way.
    coming_soon: true
