# The home page's gallery (the "See it in action" section): one card per
# example web map, in this order. assets/gallery.js reads this file.
#
# id           A short name, unique in this file.
# title        The card's title.
# extent       Where the map is: a place name, and its bounds
#              [west, south, east, north] in degrees (shown on hover).
# zooms        The web map's zoom levels [lowest, highest].
# layers       How many layers the QGIS project has.
# size         The QGIS project's data (original) and the exported web map
#              (output), in MB: the card shows the saving (sizes on hover).
# time         Optional: how long the plugin took to make it (e.g. "3.5 min").
# description  One or two short sentences.
# tags         A few words on what the example shows.
# image        A still of the map (docs/gallery/), about 16:10.
# webmap       The full web map: its folder in docs/examples/.
# view         Where the live preview and the full web map open: zoom,
#              centre [lon, lat] (without them, fitted to the map's whole
#              extent), and optionally the background (basemap: none, osm,
#              bluemarble or openfreemap).
# project      The styled data to download (a GeoPackage holding the
#              layers and their styles): address and size in MB. Leave the
#              address empty until there is one. Large files are assets of
#              the "examples" release on GitHub, not in the repository.
# source       Where the data comes from (name and address): the card's
#              "Data source" button, crediting its owner.
# coming_soon  true for a placeholder card (a title and a line of text);
#              its buttons are off.

examples:
  - id: natural-earth
    title: Natural Earth
    extent:
      name: World
      bounds: [-180, -85.85, 180, 84.05]
    zooms: [0, 8]
    layers: 235
    size:
      original: 827
      output: 73.4
    time: 6.8 min
    description: >-
      The whole Natural Earth quick-start project, from the world map
      down to regional detail.
    tags: [Rule-based styles, Scale-dependent labels, Global]
    image: gallery/natural-earth.webp
    webmap: examples/natural-earth/
    view: { zoom: 2.4, center: [20, 40] }
    project:
      url: "https://github.com/GallPeters/QGIS2VectorTiles/releases/download/examples/natural_earth_styled_sample.zip"
      size: 149.7
    source: { name: Natural Earth, url: "https://www.naturalearthdata.com/" }

  - id: jerusalem-public-transportation
    title: Jerusalem Public Transportation
    extent:
      name: Jerusalem
      bounds: [34.884, 31.495, 35.556, 32.047]
    zooms: [0, 20]
    layers: 3
    time: 26 sec
    description: >-
      Buses and light rail from GTFS data, each stop's lines as
      badges.
    tags: [HTML labels, Clusters, Hebrew labels]
    image: gallery/jerusalem-public-transportation.webp
    webmap: examples/jerusalem_public_transportation/
    view: { basemap: openfreemap, zoom: 12.4, center: [35.205, 31.785] }
    project:
      url: "examples/jerusalem_public_transportation/jerusalem_public_transportation_styled_sample.gpkg"
      size: 1.1
    source: { name: "Israel Ministry of Transport (GTFS)", url: "https://www.gov.il/he/pages/gtfs_general_transit_feed_specifications" }

  - id: coming-soon
    title: Coming soon
    description: Another example web map is on its way.
    coming_soon: true
